version: "3.8"

services:
  backend:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --log-level debug
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - POSTGRES_HOST
      - POSTGRES_PORT
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - .:/app
    depends_on:
      - postgres
    container_name: backend

  frontend:
    image: sjgaru/pic064:latest
    ports:
      - "8080:8080"
    container_name: frontend

  postgres:
    volumes:
      - back_postgres:/var/lib/postgresql/data/
    container_name: postgresql
    image: postgres:14.5
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    container_name: nginx


volumes:
  back_postgres:
  static_volume:
  media_volume:
